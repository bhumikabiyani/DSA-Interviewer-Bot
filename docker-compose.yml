version: '3.8'

services:
  api:
    build: .
    container_name: dsa-interviewer-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379
      - CHROMA_PATH=/app/data/vector_store
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - dsa-network

  redis:
    image: redis:7-alpine
    container_name: dsa-interviewer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - dsa-network

  nginx:
    image: nginx:alpine
    container_name: dsa-interviewer-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - dsa-network

volumes:
  redis-data:

networks:
  dsa-network:
    driver: bridge